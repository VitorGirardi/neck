name: sign-windows-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_PORTABLE_CONFIGURATION: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_CONFIGURATION: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $missing = @()
          foreach ($name in @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_POLICY_SLUG',
            'SIGNPATH_PORTABLE_CONFIGURATION',
            'SIGNPATH_INSTALLER_CONFIGURATION'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Configuração SignPath ausente: $($missing -join ', ')" }
          if ($env:GITHUB_REF -ne 'refs/heads/main' -and -not $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            throw "A assinatura é permitida somente para main ou tags v*: $env:GITHUB_REF"
          }

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run read-only self-test
        shell: pwsh
        run: ./test.ps1

      - name: Build portable executable
        shell: pwsh
        run: ./build.ps1

      - name: Upload unsigned portable executable
        id: portable_unsigned
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neck-portable-unsigned-${{ github.sha }}
          path: dist/Neck.exe
          if-no-files-found: error

      - name: Sign portable executable with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.portable_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-portable

      - name: Verify and stage signed portable executable
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
        run: |
          $matches = @(Get-ChildItem -LiteralPath signed-portable -Filter Neck.exe -File -Recurse)
          if ($matches.Count -ne 1) { throw "Esperado um Neck.exe assinado; encontrados: $($matches.Count)" }
          Copy-Item -LiteralPath $matches[0].FullName -Destination dist/Neck.exe -Force
          $subject = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER)) { 'SignPath Foundation' } else { $env:EXPECTED_SIGNER }
          ./verify-authenticode.ps1 -Path dist/Neck.exe -ExpectedSubject $subject -RequireTimestamp

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --silent --disable-interactivity --accept-package-agreements --accept-source-agreements

      - name: Build installer around signed application
        shell: pwsh
        run: ./build-installer.ps1 -SkipApplicationBuild

      - name: Upload unsigned installer
        id: installer_unsigned
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neck-installer-unsigned-${{ github.sha }}
          path: dist/Neck-Setup-1.18.1.exe
          if-no-files-found: error

      - name: Sign installer with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.installer_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Verify signed package and regenerate checksums
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
        run: |
          $matches = @(Get-ChildItem -LiteralPath signed-installer -Filter Neck-Setup-1.18.1.exe -File -Recurse)
          if ($matches.Count -ne 1) { throw "Esperado um instalador assinado; encontrados: $($matches.Count)" }
          Copy-Item -LiteralPath $matches[0].FullName -Destination dist/Neck-Setup-1.18.1.exe -Force
          ./write-checksums.ps1 -Path dist/Neck.exe, dist/Neck-Setup-1.18.1.exe | Out-Host
          $subject = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER)) { 'SignPath Foundation' } else { $env:EXPECTED_SIGNER }
          ./verify-package.ps1 -ExpectedSigner $subject -RequireTimestamp

      - name: Upload verified signed package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neck-windows-signed-${{ github.sha }}
          path: |
            dist/Neck.exe
            dist/Neck.exe.sha256
            dist/Neck-Setup-1.18.1.exe
            dist/Neck-Setup-1.18.1.exe.sha256
          if-no-files-found: error
