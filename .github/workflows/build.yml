name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run read-only self-test
        shell: pwsh
        run: ./test.ps1

      - name: Build Windows executable
        shell: pwsh
        run: ./build.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mestre-pc-care-windows
          path: dist/Neck.exe
          if-no-files-found: error
