name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run read-only self-test
        shell: pwsh
        run: ./test.ps1

      - name: Build Windows executable
        shell: pwsh
        run: ./build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --silent --disable-interactivity --accept-package-agreements --accept-source-agreements

      - name: Build installer and checksums
        shell: pwsh
        run: ./build-installer.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: neck-windows
          path: |
            dist/Neck.exe
            dist/Neck.exe.sha256
            dist/Neck-Setup-1.3.0.exe
            dist/Neck-Setup-1.3.0.exe.sha256
          if-no-files-found: error
